<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-hub</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --sel:#eef3ff;
          --needs_input:#d70015; --working:#0a84ff; --done:#248a3d; --failed:#bf5af2; --other:#8e8e93; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --mute:#98989d; --line:#3a3a3c; --sel:#2c3a55; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, Menlo, monospace; }
  header { display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; }
  nav a { color:var(--mute); margin-right:10px; text-decoration:none; }
  nav a.on { color:var(--fg); font-weight:bold; }
  #summary, #help { color:var(--mute); }
  input { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:2px 6px; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }
  tr.sel { background:var(--sel); }
  .chip { display:inline-block; padding:0 6px; border-radius:4px; color:#fff; background:var(--other); }
  .wrap { overflow-x:auto; }
  section { display:none; margin-top:12px; }
  section.on { display:block; }
  svg text { fill:var(--fg); font-size:11px; }
  svg line.edge { stroke:var(--line); }
</style>
</head>
<body>
<header>
  <h1>cc-hub</h1>
  <nav><a href="#agents">agents</a><a href="#graph">graph</a><a href="#metrics">metrics</a></nav>
  <span id="summary"></span>
  <input id="filter" placeholder="/ filter" size="20">
  <span id="help">g a / g g / g m views · j k move · / filter · Esc clear</span>
</header>

<section id="agents">
  <div class="wrap"><table>
    <thead><tr><th>state</th><th>key / name</th><th>repo</th><th>branch</th><th>kind</th><th>updated</th><th>last message</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <h1 style="margin-top:20px">Timeline (last 24 h)</h1>
  <div class="wrap"><svg id="timeline" width="100%"></svg></div>
</section>

<section id="graph">
  <p id="graph-help" style="color:var(--mute)">Repositories and the sessions that work in them. Colour is session state.</p>
  <div class="wrap"><svg id="graph-svg" width="100%"></svg></div>
</section>

<section id="metrics">
  <p style="color:var(--mute)">Sessions per state, sampled by cc-hubd at each poll (last 24 h).</p>
  <div class="wrap"><svg id="metrics-svg" width="100%" height="260"></svg></div>
</section>

<script>
const css = v => getComputedStyle(document.documentElement).getPropertyValue('--' + v).trim();
const color = s => css(s) || css('other');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = t => { if (!t) return ''; const m = Math.round((Date.now()/1000 - t) / 60); return m < 60 ? m + 'm' : Math.round(m/60) + 'h'; };
const label = s => s.key || s.name || s.sid.slice(0, 8);
let data = [], metrics = [], sel = 0;

function visible() {
  const q = document.getElementById('filter').value.toLowerCase();
  return data.filter(s => s.state !== 'ended' && (!q || JSON.stringify(s).toLowerCase().includes(q)));
}

function route() {
  const view = (location.hash || '#agents').slice(1);
  document.querySelectorAll('section').forEach(e => e.classList.toggle('on', e.id === view));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + view));
  if (view === 'metrics') fetch('/api/metrics.json').then(r => r.json()).then(m => { metrics = m; drawMetrics(); });
  render();
}

function render() {
  const rows = visible();
  sel = Math.min(sel, Math.max(rows.length - 1, 0));
  const n = st => data.filter(s => s.state === st).length;
  document.getElementById('summary').textContent =
    `needs input ${n('needs_input')} · working ${n('working')} · done ${n('done')} · failed ${n('failed')}`;
  document.getElementById('rows').innerHTML = rows.map((s, i) => `<tr class="${i === sel ? 'sel' : ''}">
    <td><span class="chip" style="background:${color(s.state)}">${esc(s.state)}</span></td>
    <td>${esc(label(s))}</td><td>${esc(s.repo)}</td><td>${esc(s.branch)}</td>
    <td>${esc(s.kind)}</td><td>${ago(s.updated_at)}</td><td title="${esc(s.last_msg)}">${esc(s.last_msg)}</td></tr>`).join('');
  drawTimeline(rows);
  drawGraph(rows);
}

function drawTimeline(rows) {
  const svg = document.getElementById('timeline'), W = svg.clientWidth || 900, lane = 18, left = 200;
  const now = Date.now() / 1000, start = now - 86400, x = t => left + (W - left) * (Math.max(t, start) - start) / 86400;
  svg.setAttribute('height', rows.length * lane + 20);
  svg.innerHTML = rows.map((s, i) => {
    const t0 = s.started_at ? s.started_at / 1000 : s.updated_at, y = i * lane;
    return `<text x="0" y="${y + 12}">${esc(label(s).slice(0, 28))}</text>
      <rect x="${x(t0)}" y="${y + 3}" width="${Math.max(x(now) - x(t0), 2)}" height="${lane - 6}" fill="${color(s.state)}" opacity="0.8"/>`;
  }).join('') + [0, 6, 12, 18, 24].map(h => `<text x="${x(start + h * 3600)}" y="${rows.length * lane + 14}">-${24 - h}h</text>`).join('');
}

function drawGraph(rows) {
  const svg = document.getElementById('graph-svg'), W = svg.clientWidth || 900, lane = 22;
  const repos = [...new Set(rows.map(s => s.repo || '(no repo)'))];
  svg.setAttribute('height', Math.max(repos.length, rows.length) * lane + 20);
  const ry = r => repos.indexOf(r) * lane + 14, sx = W * 0.45;
  svg.innerHTML =
    rows.map((s, i) => `<line class="edge" x1="160" y1="${ry(s.repo || '(no repo)') - 4}" x2="${sx}" y2="${i * lane + 10}"/>`).join('') +
    repos.map(r => `<text x="0" y="${ry(r)}">${esc(r.slice(0, 24))}</text>`).join('') +
    rows.map((s, i) => `<circle cx="${sx}" cy="${i * lane + 10}" r="5" fill="${color(s.state)}"/>
      <text x="${sx + 12}" y="${i * lane + 14}">${esc(label(s).slice(0, 40))} · ${esc(s.branch)}</text>`).join('');
}

function drawMetrics() {
  const svg = document.getElementById('metrics-svg'), W = svg.clientWidth || 900, H = 230, left = 30;
  const now = Date.now() / 1000, start = now - 86400, x = t => left + (W - left - 90) * (t - start) / 86400;
  const states = [...new Set(metrics.map(m => m.state))];
  const max = Math.max(1, ...metrics.map(m => m.n)), y = n => H - (H - 10) * n / max;
  svg.innerHTML = states.map((st, i) => {
    const pts = metrics.filter(m => m.state === st).map(m => `${x(m.ts)},${y(m.n)}`).join(' ');
    return `<polyline fill="none" stroke="${color(st)}" stroke-width="2" points="${pts}"/>
      <text x="${W - 80}" y="${14 + i * 14}" style="fill:${color(st)}">${esc(st)}</text>`;
  }).join('') + `<text x="0" y="12">${max}</text><text x="0" y="${H}">0</text>` +
    [0, 6, 12, 18, 24].map(h => `<text x="${x(start + h * 3600)}" y="${H + 16}">-${24 - h}h</text>`).join('');
}

new EventSource('/events').onmessage = e => { data = JSON.parse(e.data); render(); };
fetch('/api/sessions.json').then(r => r.json()).then(d => { data = d; route(); });
window.addEventListener('hashchange', route);

// Keys avoid SPC, so the Emacs leader stays usable outside xwidget edit mode.
let pendingG = false;
document.addEventListener('keydown', e => {
  const f = document.getElementById('filter');
  if (document.activeElement === f) { if (e.key === 'Escape') { f.value = ''; f.blur(); render(); } return; }
  if (pendingG) {
    pendingG = false;
    const view = {a: 'agents', g: 'graph', m: 'metrics'}[e.key];
    if (view) location.hash = view;
    return;
  }
  if (e.key === 'g') pendingG = true;
  else if (e.key === 'j') { sel++; render(); }
  else if (e.key === 'k') { sel = Math.max(sel - 1, 0); render(); }
  else if (e.key === '/') { e.preventDefault(); f.focus(); }
});
document.getElementById('filter').addEventListener('input', render);
</script>
</body>
</html>
